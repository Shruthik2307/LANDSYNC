name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deployment-hygiene:
    name: Deployment architecture guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No split-deployment dependencies in runtime code
        run: bash scripts/check-deployment-hygiene.sh

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx vitest run
      - run: npm run build

  backend:
    name: Backend (pytest + data integrity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system GIS libs (GDAL/GEOS needed by GeoPandas)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Unit tests
        working-directory: backend
        run: python -m pytest tests/test_backend.py -q
      - name: Engine conflict-scoring tests
        working-directory: backend
        run: python -m pytest ../tests/test_conflicts.py -q
      - name: Data integrity (uniqueness, geometry, anti-degenerate scoring)
        run: python scripts/check_data_integrity.py
      - name: ML guardrails (no synthetic training, artifact validity, no fabrication)
        run: python scripts/check_ml_guardrails.py
      - name: Hybrid engine tests (metrics, geometry, candidates, fusion, registry)
        working-directory: backend
        run: python -m pytest tests/test_hybrid_engine.py tests/test_demo_isolation.py -q
